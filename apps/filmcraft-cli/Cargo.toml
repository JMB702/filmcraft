[package]
name = "filmcraft-cli"
description = "FilmCraft headless CLI and MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[[bin]]
name = "filmcraft-cli"
path = "src/main.rs"

[features]
# Release builds transcribe (docs/transcripts.md); the models download on first use.
default = ["transcription"]
# Speech-to-text (Text panel ▸ Transcribe…): Parakeet, Whisper for other languages, neural
# speaker labels, and model downloads.
transcription = ["parakeet", "whisper"]
# NVIDIA Parakeet speech-to-text and TitaNet speaker labels (candle; Metal on macOS).
parakeet = ["filmcraft-engine/parakeet", "filmcraft-engine/speech-download"]
# Whisper speech-to-text (candle; Metal on macOS), and model downloads.
whisper = ["filmcraft-engine/whisper", "filmcraft-engine/speech-download"]

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-export = { workspace = true }
filmcraft-project = { workspace = true }
filmcraft-render = { workspace = true }
filmcraft-time = { workspace = true }
filmcraft-gpu = { workspace = true }
filmcraft-media = { workspace = true }
filmcraft-codecs = { workspace = true }
filmcraft-platform = { workspace = true }
craft-media = { workspace = true, features = ["mpegts", "mxf", "ogg"] }
filmcraft-automation = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
filmcraft-testkit = { workspace = true }
tempfile = "3"
