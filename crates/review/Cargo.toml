[package]
name = "filmcraft-review"
description = "Review links: shares, comment queue, exact frame mapping and the self-hosted review server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["server"]
# The HTTP review server and the files it reads and writes. The wasm review page turns it off and
# uses only the shared model and time mapping.
server = ["dep:sha2"]

[dependencies]
filmcraft-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { version = "0.10", optional = true }

[dev-dependencies]
tempfile = "3"
